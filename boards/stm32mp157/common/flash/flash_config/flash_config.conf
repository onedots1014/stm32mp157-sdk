# Flash Configuration for STM32MP157

# STM32CubeProgrammer path
STM32_PROGRAMMER_CLI="STM32_Programmer_CLI"

# Default connection settings
DEFAULT_CONNECTION="port=USB1"

# Available flash profiles
AVAILABLE_PROFILES=(
    "full:Full system flash (all components):Update_emmc_all.tsv"
    "kernel:Kernel only flash (bootfs + rootfs):Update_emmc_kernel.tsv"
    "bootloader:Bootloader only (TFA + U-Boot):Update_emmc_bootloader.tsv"
    "rootfs:RootFS only flash (rootfs partition):Update_emmc_rootfs.tsv"
    "buildroot:Full system flash (all components):Update_emmc_buildroot.tsv"
)
