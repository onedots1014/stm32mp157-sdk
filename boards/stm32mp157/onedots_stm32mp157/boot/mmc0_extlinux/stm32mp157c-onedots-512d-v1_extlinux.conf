# SD card boot (mmc0): kernel and DTB live in the bootfs partition (p4),
# rootfs is p5 -- see buildroot/board/scripts/genimage-tfa.cfg
menu title Select the boot mode
TIMEOUT 20
DEFAULT onedots-sdcard
LABEL onedots-sdcard
	KERNEL /uImage
	FDT /stm32mp157c-onedots-512d-v1.dtb
	APPEND root=/dev/mmcblk0p5 rootwait rw console=ttySTM0,115200
