image bootfs.ext4 {
    vfat {
        files = {
            "stm32mp157c-onedots-512d-v1.dtb",
            "uImage",
			"mmc1_extlinux",
			"mmc0_extlinux",
        }
    }
    size = 32M
}

image onedots-stm32mp157-512d-v1-tfa.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition fsbl1 {
		image = "tf-a-onedots-stm32mp157c-evb.stm32"
		size = 2M
	}

	partition fsbl2 {
		image = "tf-a-onedots-stm32mp157c-evb.stm32"
		size = 2M
	}

	# TODO: TF-A v2.10 boots U-Boot from a FIP (fip.bin, as build.sh produces);
	# this partition still uses the pre-FIP u-boot.stm32 layout. Not yet
	# migrated or tested -- use build.sh for a working image.
	partition ssbl {
		image = "u-boot.stm32"
		size = 4M
	}
	partition rootfs {
		image = "rootfs.ext4"
		bootable = "yes"
		size = 1500M
	}
	partition userdata {
		bootable = "yes"
		size = 500M

	}
}
