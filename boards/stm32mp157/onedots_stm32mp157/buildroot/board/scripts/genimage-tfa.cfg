# Same layout as build.sh + boards/stm32mp157/common/flash/*.tsv:
# TF-A (fsbl1/2) -> FIP (TF-A BL32 + U-Boot) -> bootfs (vfat: uImage, dtb,
# extlinux) -> rootfs.
#
# bootfs.ext4 / rootfs.ext4 are what the eMMC flash layout (TSV) uses.
# sdcard.img is the same chain for an SD card: the BootROM looks for GPT
# partitions named fsbl1/fsbl2, TF-A then loads the partition named "fip".

image bootfs.ext4 {
	vfat {
		files = {
			"uImage",
			"stm32mp157c-onedots-512d-v1.dtb",
			"mmc0_extlinux",
			"mmc1_extlinux",
		}
	}
	size = 32M
}

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition fsbl1 {
		image = "tf-a-onedots-stm32mp157c-evb.stm32"
		size = 256K
	}

	partition fsbl2 {
		image = "tf-a-onedots-stm32mp157c-evb.stm32"
		size = 256K
	}

	partition fip {
		image = "fip.bin"
		size = 2M
	}

	partition bootfs {
		image = "bootfs.ext4"
		bootable = "yes"
		size = 64M
	}

	partition rootfs {
		image = "rootfs.ext4"
	}
}
